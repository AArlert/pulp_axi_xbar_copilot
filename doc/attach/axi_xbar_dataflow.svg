<svg viewBox="0 0 1120 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#c2410c"/>
    </marker>
    <marker id="arrowGray" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1120" height="620" rx="14" fill="#f5f6fa"/>

  <!-- title -->
  <text x="560" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b">axi_xbar 请求/响应数据流（示意）</text>
  <text x="560" y="49" text-anchor="middle" font-size="12" fill="#475569">基线配置 NoSlvPorts=6，NoMstPorts=8；图中仅示意 3 条端口 + 省略号，实际按参数展开</text>

  <!-- ============ lane 0 ============ -->
  <!-- slave port -->
  <rect x="20" y="90" width="90" height="50" rx="7" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="65" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">S0</text>
  <text x="65" y="128" text-anchor="middle" font-size="10" fill="#64748b">AXI master</text>
  <!-- addr_decode -->
  <line x1="110" y1="115" x2="148" y2="115" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <rect x="150" y="90" width="140" height="50" rx="7" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="220" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">addr_decode</text>
  <text x="220" y="128" text-anchor="middle" font-size="10" fill="#64748b">AW/AR 各一次</text>
  <!-- axi_demux -->
  <line x1="290" y1="115" x2="328" y2="115" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <rect x="330" y="90" width="130" height="50" rx="7" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="395" y="119" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">axi_demux</text>
  <!-- into crossbar -->
  <line x1="460" y1="115" x2="508" y2="115" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <!-- out of crossbar -->
  <line x1="750" y1="115" x2="788" y2="115" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <!-- axi_mux -->
  <rect x="790" y="90" width="140" height="50" rx="7" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="860" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">axi_mux</text>
  <text x="860" y="128" text-anchor="middle" font-size="10" fill="#64748b">仲裁 + ID 前缀</text>
  <!-- master port -->
  <line x1="930" y1="115" x2="968" y2="115" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <rect x="970" y="90" width="90" height="50" rx="7" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="1015" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">M0</text>
  <text x="1015" y="128" text-anchor="middle" font-size="10" fill="#64748b">AXI slave</text>

  <!-- ============ lane 1 ============ -->
  <rect x="20" y="170" width="90" height="50" rx="7" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="65" y="192" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">S1</text>
  <text x="65" y="208" text-anchor="middle" font-size="10" fill="#64748b">AXI master</text>
  <line x1="110" y1="195" x2="148" y2="195" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <rect x="150" y="170" width="140" height="50" rx="7" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="220" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">addr_decode</text>
  <text x="220" y="208" text-anchor="middle" font-size="10" fill="#64748b">AW/AR 各一次</text>
  <line x1="290" y1="195" x2="328" y2="195" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <rect x="330" y="170" width="130" height="50" rx="7" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="395" y="199" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">axi_demux</text>
  <line x1="460" y1="195" x2="508" y2="195" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="750" y1="195" x2="788" y2="195" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <rect x="790" y="170" width="140" height="50" rx="7" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="860" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">axi_mux</text>
  <text x="860" y="208" text-anchor="middle" font-size="10" fill="#64748b">仲裁 + ID 前缀</text>
  <line x1="930" y1="195" x2="968" y2="195" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <rect x="970" y="170" width="90" height="50" rx="7" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="1015" y="192" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">M1</text>
  <text x="1015" y="208" text-anchor="middle" font-size="10" fill="#64748b">AXI slave</text>

  <!-- ============ ellipsis row ============ -->
  <text x="65" y="250" text-anchor="middle" font-size="18" fill="#94a3b8">⋮</text>
  <text x="220" y="250" text-anchor="middle" font-size="18" fill="#94a3b8">⋮</text>
  <text x="395" y="250" text-anchor="middle" font-size="18" fill="#94a3b8">⋮</text>
  <text x="860" y="250" text-anchor="middle" font-size="18" fill="#94a3b8">⋮</text>
  <text x="1015" y="250" text-anchor="middle" font-size="18" fill="#94a3b8">⋮</text>

  <!-- ============ lane last ============ -->
  <rect x="20" y="270" width="90" height="50" rx="7" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="65" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">S(N-1)</text>
  <text x="65" y="308" text-anchor="middle" font-size="10" fill="#64748b">AXI master</text>
  <line x1="110" y1="295" x2="148" y2="295" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <rect x="150" y="270" width="140" height="50" rx="7" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="220" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">addr_decode</text>
  <text x="220" y="308" text-anchor="middle" font-size="10" fill="#64748b">AW/AR 各一次</text>
  <line x1="290" y1="295" x2="328" y2="295" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <rect x="330" y="270" width="130" height="50" rx="7" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="395" y="299" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">axi_demux</text>
  <line x1="460" y1="295" x2="508" y2="295" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="750" y1="295" x2="788" y2="295" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <rect x="790" y="270" width="140" height="50" rx="7" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="860" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">axi_mux</text>
  <text x="860" y="308" text-anchor="middle" font-size="10" fill="#64748b">仲裁 + ID 前缀</text>
  <line x1="930" y1="295" x2="968" y2="295" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <rect x="970" y="270" width="90" height="50" rx="7" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="1015" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">M(M-1)</text>
  <text x="1015" y="308" text-anchor="middle" font-size="10" fill="#64748b">AXI slave</text>

  <!-- ============ crossbar matrix (shared) ============ -->
  <rect x="510" y="70" width="240" height="280" rx="10" fill="#eef2ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="630" y="93" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">交叉连接矩阵</text>
  <text x="630" y="109" text-anchor="middle" font-size="11" fill="#4338ca">NoSlvPorts × NoMstPorts</text>
  <text x="630" y="126" text-anchor="middle" font-size="9.5" fill="#6366f1">(路由由地址查表决定，非固定直连；图中仅示意)</text>

  <rect x="530" y="145" width="200" height="42" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.3"/>
  <text x="630" y="163" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">axi_multicut</text>
  <text x="630" y="178" text-anchor="middle" font-size="9.5" fill="#047857">连通时，流水线切割</text>

  <rect x="530" y="197" width="200" height="42" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.3"/>
  <text x="630" y="215" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">axi_err_slv</text>
  <text x="630" y="230" text-anchor="middle" font-size="9.5" fill="#b91c1c">未连通时（稀疏矩阵）</text>

  <text x="630" y="260" text-anchor="middle" font-size="9.5" fill="#6366f1">每格按 Connectivity[i][j] 二选一逐格例化，</text>
  <text x="630" y="274" text-anchor="middle" font-size="9.5" fill="#6366f1">图中不逐格展开</text>

  <!-- ============ error sink (shared, decode-error path) ============ -->
  <line x1="395" y1="320" x2="395" y2="398" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowGray)"/>
  <line x1="630" y1="350" x2="630" y2="398" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowGray)"/>
  <rect x="330" y="400" width="380" height="56" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="520" y="419" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">axi_err_slv（两处，行为相同）</text>
  <text x="520" y="435" text-anchor="middle" font-size="9.5" fill="#b91c1c">地址查不到（demux） / 矩阵中该路未连接（交叉矩阵）</text>
  <text x="520" y="449" text-anchor="middle" font-size="9.5" fill="#b91c1c">ATOP 打开时经 axi_atop_filter 伪造双响应（B+R）</text>

  <!-- ============ response bus (B/R return path) ============ -->
  <line x1="1015" y1="140" x2="1015" y2="484" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="6,4"/>
  <line x1="1015" y1="220" x2="1015" y2="484" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="6,4"/>
  <line x1="1015" y1="320" x2="1015" y2="484" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="6,4"/>
  <line x1="65" y1="484" x2="1015" y2="484" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="6,4"/>
  <line x1="65" y1="484" x2="65" y2="142" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrowOrange)"/>
  <line x1="65" y1="484" x2="65" y2="222" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrowOrange)"/>
  <line x1="65" y1="484" x2="65" y2="322" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrowOrange)"/>
  <text x="560" y="503" text-anchor="middle" font-size="11" fill="#9a3412">B/R 响应原路返回：凭 axi_mux 端前缀进 ID 的来源端口号寻路，回到原 slave 端口</text>

  <!-- ============ legend ============ -->
  <line x1="40" y1="545" x2="90" y2="545" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
  <text x="100" y="549" font-size="11" fill="#334155">请求方向：AW/AR/W（Sx → addr_decode → axi_demux → 交叉矩阵 → axi_mux → Mx）</text>

  <line x1="40" y1="568" x2="90" y2="568" stroke="#c2410c" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#arrowOrange)"/>
  <text x="100" y="572" font-size="11" fill="#334155">响应方向：B/R 原路返回（凭 ID 前缀寻路，不重新查地址表）</text>

  <line x1="40" y1="591" x2="90" y2="591" stroke="#6b7280" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowGray)"/>
  <text x="100" y="595" font-size="11" fill="#334155">axi_err_slv：地址查不到 / 矩阵中该路未连接，两处功能相同</text>
</svg>
