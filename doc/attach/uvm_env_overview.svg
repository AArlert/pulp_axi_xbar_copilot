  <line x1="825" y1="162" x2="675" y2="162" stroke="#c2410c" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrowResp)"/>
  <line x1="517" y1="162" x2="485" y2="162" stroke="#c2410c" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrowResp)"/>
