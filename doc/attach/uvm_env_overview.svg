  <polyline points="493,296 493,310 287,310 287,427" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowAna)"/>
  <polyline points="537,296 537,310 627,310 627,427" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowAna)"/>
  <text x="427" y="322" font-size="8" fill="#0d9488">req_accept_ap / req_ap / resp_ap</text>
  <polyline points="750,296 750,320 457,320 457,427" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowAna)"/>
  <text x="756" y="316" font-size="8" fill="#0d9488">req_ap</text>
  <rect x="748" y="396" width="118" height="176" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="807" y="416" text-anchor="middle" font-size="10.5" font-weight="700" fill="#065f46">functional_</text>
  <text x="807" y="430" text-anchor="middle" font-size="10.5" font-weight="700" fill="#065f46">coverage.sv</text>
  <text x="807" y="454" text-anchor="middle" font-size="8.4" fill="#047857">独立 covergroup 集</text>
  <text x="807" y="470" text-anchor="middle" font-size="8.0" fill="#047857">由 scoreboard 采样喂入</text>
  <text x="807" y="492" text-anchor="middle" font-size="7.8" fill="#059669">cg_stall / cg_tx_limit</text>
  <text x="807" y="506" text-anchor="middle" font-size="7.8" fill="#059669">cg_w_order …</text>
  <line x1="726" y1="484" x2="745" y2="484" stroke="#0d9488" stroke-width="1.6" marker-end="url(#arrowAna)"/>
  <rect x="878" y="396" width="118" height="176" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="937" y="416" text-anchor="middle" font-size="10.5" font-weight="700" fill="#5b21b6">tb/sva/*</text>
  <text x="937" y="438" text-anchor="middle" font-size="8.4" fill="#6d28d9">协议 / 时序 SVA</text>
  <text x="937" y="454" text-anchor="middle" font-size="8.0" fill="#6d28d9">generate 直接例化</text>
  <text x="937" y="468" text-anchor="middle" font-size="7.6" fill="#7c3aed">（非 bind，见头注）</text>
  <text x="937" y="490" text-anchor="middle" font-size="7.8" fill="#7c3aed">axi_chan / route /</text>
  <text x="937" y="504" text-anchor="middle" font-size="7.8" fill="#7c3aed">stall / worder …</text>
  <line x1="30" y1="602" x2="78" y2="602" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowReq)"/>
  <text x="88" y="606" font-size="11" fill="#334155">请求正向：seq → sequencer → driver → DUT slave 端口 → DUT master 端口 → responder</text>
  <line x1="30" y1="624" x2="78" y2="624" stroke="#c2410c" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowResp)"/>
  <text x="88" y="628" font-size="11" fill="#334155">响应回程：responder 回 B/R → 沿原路经 DUT → 被 slvport_monitor 在源 slave 端口观测</text>
  <line x1="30" y1="646" x2="78" y2="646" stroke="#0d9488" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowAna)"/>
  <text x="88" y="650" font-size="11" fill="#334155">analysis port（TB 观测流）：monitor 把观测到的事务经 analysis port 送进 scoreboard 对应 handler 判决</text>
</svg>
