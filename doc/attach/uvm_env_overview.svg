  <rect x="0" y="0" width="1020" height="700" rx="14" fill="#f5f6fa"/>
  <text x="510" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b">验证环境（UVM TB）组件图 —— 一笔写事务的判决数据流</text>
  <text x="510" y="56" text-anchor="middle" font-size="12" fill="#475569">外部 AXI 由 TB 扮演：slave 侧是主动 driver，master 侧是反应式 responder（TB 在此当被动 slave）。monitor 只观测、不驱动。</text>
  <rect x="338" y="105" width="251" height="201" rx="10" fill="#f7f6ff" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="344" y="99" font-size="10.5" font-weight="700" fill="#4338ca">slvport_agent ×NoSlvPorts</text>
  <rect x="664" y="105" width="344" height="201" rx="10" fill="#f7fbff" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="670" y="99" font-size="10.5" font-weight="700" fill="#4338ca">mstport_agent ×NoMstPorts</text>
  <rect x="24" y="117" width="156" height="66" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
  <text x="102" y="142" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e293b">seq_lib.sv</text>
  <text x="102" y="159" text-anchor="middle" font-size="8.6" fill="#64748b">seq / vseq</text>
  <text x="102" y="172" text-anchor="middle" font-size="8.6" fill="#64748b">fanout_per_slv#(T)</text>
  <rect x="202" y="117" width="126" height="66" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
  <text x="265" y="142" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e293b">slvport_sequencer</text>
  <text x="265" y="159" text-anchor="middle" font-size="8.6" fill="#64748b">由 xbar_vseqr 聚合</text>
  <text x="265" y="172" text-anchor="middle" font-size="8.6" fill="#64748b">slv_sqr[i]</text>
  <rect x="350" y="117" width="132" height="66" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
  <text x="416" y="142" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e293b">slvport_driver</text>
  <text x="416" y="159" text-anchor="middle" font-size="8.6" fill="#64748b">drive_write / _read</text>
  <text x="416" y="172" text-anchor="middle" font-size="8.6" fill="#64748b">drive_pair / _burst</text>
  <rect x="520" y="117" width="152" height="66" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2.0"/>
