  <text x="501" y="279" text-anchor="middle" font-size="8.2" fill="#64748b">req_accept_ap · req_ap · resp_ap</text>
  <rect x="676" y="244" width="148" height="52" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
  <text x="750" y="264" text-anchor="middle" font-size="11" font-weight="700" fill="#0f766e">mstport_monitor</text>
  <text x="750" y="279" text-anchor="middle" font-size="8.2" fill="#64748b">req_ap（请求侧观测）</text>
  <line x1="501" y1="183" x2="501" y2="241" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="3,3" marker-end="url(#arrowAna)"/>
  <text x="506" y="213" font-size="8" fill="#0d9488">观测 slave 端口</text>
  <line x1="750" y1="183" x2="750" y2="241" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="3,3" marker-end="url(#arrowAna)"/>
  <text x="755" y="213" font-size="8" fill="#0d9488">观测 master 端口</text>
  <rect x="24" y="396" width="700" height="176" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/>
  <text x="34" y="414" font-size="12.5" font-weight="700" fill="#92400e">scoreboard_refmodel.sv —— spec 推导的参考模型 + 五合一判决</text>
  <rect x="38" y="430" width="158" height="96" rx="7" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="117" y="448" text-anchor="middle" font-size="10" font-weight="700" fill="#0f766e">write_slv_req_accept</text>
