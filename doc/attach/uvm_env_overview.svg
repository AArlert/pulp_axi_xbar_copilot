  <text x="117" y="482" text-anchor="middle" font-size="8.2" fill="#475569">or_open_q 开单 · cg_stall</text>
  <text x="117" y="498" text-anchor="middle" font-size="8.2" fill="#475569">cg_tx_limit · worder_pend</text>
  <text x="117" y="516" text-anchor="middle" font-size="7.6" fill="#94a3b8">判据锚回 doc/spec.md</text>
  <rect x="208" y="430" width="158" height="96" rx="7" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="287" y="448" text-anchor="middle" font-size="10" font-weight="700" fill="#0f766e">write_slv_req</text>
  <text x="287" y="464" text-anchor="middle" font-size="8.4" fill="#64748b">w_last 流（写）</text>
  <text x="287" y="482" text-anchor="middle" font-size="8.2" fill="#475569">查活表定目标 master 端口</text>
  <text x="287" y="498" text-anchor="middle" font-size="8.2" fill="#475569">登记 pending_by_id 路由期望</text>
  <text x="287" y="516" text-anchor="middle" font-size="7.6" fill="#94a3b8">判据锚回 doc/spec.md</text>
  <rect x="378" y="430" width="158" height="96" rx="7" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="457" y="448" text-anchor="middle" font-size="10" font-weight="700" fill="#b45309">write_mst_req</text>
  <text x="457" y="464" text-anchor="middle" font-size="8.4" fill="#64748b">master 端口请求侧</text>
  <text x="457" y="482" text-anchor="middle" font-size="8.2" fill="#475569">SB_ROUTE：端口/前缀 ID 对不对</text>
  <text x="457" y="498" text-anchor="middle" font-size="8.2" fill="#475569">SB_WORDER：同源 W 保序</text>
  <text x="457" y="516" text-anchor="middle" font-size="7.6" fill="#94a3b8">判据锚回 doc/spec.md</text>
  <rect x="548" y="430" width="158" height="96" rx="7" fill="#ffffff" stroke="#c2410c" stroke-width="1.5"/>
  <text x="627" y="448" text-anchor="middle" font-size="10" font-weight="700" fill="#c2410c">write_resp</text>
  <text x="627" y="464" text-anchor="middle" font-size="8.4" fill="#64748b">B/R 响应流</text>
  <text x="627" y="482" text-anchor="middle" font-size="8.2" fill="#475569">SB_RESP_ROUTE · SB_OR_REORDER</text>
  <text x="627" y="498" text-anchor="middle" font-size="8.2" fill="#475569">SB_DECERR_ORDER · atop 配对</text>
  <text x="627" y="516" text-anchor="middle" font-size="7.6" fill="#94a3b8">判据锚回 doc/spec.md</text>
