  <text x="596" y="159" text-anchor="middle" font-size="8.6" fill="#64748b">被测黑盒</text>
  <text x="596" y="172" text-anchor="middle" font-size="8.6" fill="#64748b">slave 端口 ↔ master 端口</text>
  <rect x="828" y="117" width="168" height="66" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
