# CI hard gate: doc structure + evidence chain consistency.
# Simulation gating stays in the local VM (no EDA licenses here).
# 0.5.15: the selftest step retired — its target (scripts/tests, 60 unit
# tests) was deleted in the 0.5.4 reset with the process layer it fused, and
# the stale step made every run fail regardless of the commit's content
# (BUG-0077 audit, workflow finding #5). --check itself carries the
# machinery-still-works role: it parses every table/file the scripts own and
# hard-fails on any inconsistency.
name: ci
on:
  push:
  pull_request:
jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      # full history + tags: --check verifies pre-reset evidence paths
      # against the v0.5.3-pre-reset tag (a shallow, tagless checkout would
      # false-fail every archived-evidence row).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check (docs + consistency gates)
        run: python3 scripts/docs.py --check
      - name: handoff smoke (guard scripts parse all paths without crashing)
        run: python3 scripts/docs.py --handoff
